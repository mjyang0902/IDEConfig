# ~/.config/tmux/tmux.conf
# Shared config for macOS + WSL/Linux


# ============================================================
# Terminal / Colors
# ============================================================

set -g default-terminal "tmux-256color"

# True color
set-option -sa terminal-overrides ",xterm*:Tc"

# Mouse support
set -g mouse on

# Allow terminal passthrough (e.g. image.nvim)
set -g allow-passthrough on

# Undercurl support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'


# ============================================================
# Prefix
# ============================================================

unbind C-b

set -g prefix C-Space
bind C-Space send-prefix


# ============================================================
# Windows / Panes
# ============================================================

# Start numbering from 1
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows after one is closed
set -g renumber-windows on

# Alt + Shift + H/L to switch windows
bind -n M-H previous-window
bind -n M-L next-window


# ============================================================
# Copy mode / Clipboard
# ============================================================

set -g set-clipboard on

# vi-style copy mode
setw -g mode-keys vi

# macOS  -> pbcopy
# WSL    -> clip.exe
# Linux  -> wl-copy / xclip if available

bind-key -T copy-mode C-c send-keys -X copy-pipe-and-cancel \
    'if command -v pbcopy >/dev/null 2>&1; then pbcopy; \
     elif command -v clip.exe >/dev/null 2>&1; then clip.exe; \
     elif command -v wl-copy >/dev/null 2>&1; then wl-copy; \
     elif command -v xclip >/dev/null 2>&1; then xclip -selection clipboard; \
     else cat >/dev/null; fi'

bind-key -T copy-mode-vi C-c send-keys -X copy-pipe-and-cancel \
    'if command -v pbcopy >/dev/null 2>&1; then pbcopy; \
     elif command -v clip.exe >/dev/null 2>&1; then clip.exe; \
     elif command -v wl-copy >/dev/null 2>&1; then wl-copy; \
     elif command -v xclip >/dev/null 2>&1; then xclip -selection clipboard; \
     else cat >/dev/null; fi'


# ============================================================
# Pane creation
# ============================================================

# New panes:
# - inherit current directory
# - expose parent pane ID for tmux-conda-inherit

unbind %

bind % split-window \
    -h \
    -c "#{pane_current_path}" \
    -e "TMUX_PARENT_PANE_ID=#{pane_id}"

unbind '"'

bind '"' split-window \
    -v \
    -c "#{pane_current_path}" \
    -e "TMUX_PARENT_PANE_ID=#{pane_id}"


# ============================================================
# TPM / Plugins
# ============================================================

# Store all plugins under ~/.config/tmux/plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Navigate between Vim/Neovim and tmux panes seamlessly
set -g @plugin 'christoomey/vim-tmux-navigator'

# Theme
set -g @plugin 'khanghh/tmux-dark-plus-theme'

# Utilities
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-yank'

# Preserve Conda environment when opening panes
set -g @plugin 'oluevaera/tmux-conda-inherit'


# ============================================================
# Optional themes
# ============================================================

# Catppuccin
# set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
# set -g @catppuccin_flavour 'latte'

# One Dark Pro
# set -g @plugin 'evanzhoudev/onedarkpro-tmux'


# ============================================================
# TPM initialization
#
# MUST stay at the bottom.
# ============================================================

run '~/.config/tmux/plugins/tpm/tpm'

